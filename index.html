<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a3d28">
<title>Кризис-Рулетка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold-hi: #f7e08a;
    --gold: #e8c14e;
    --gold-lo: #9c7016;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #efe9da;
    /* casino felt */
    background:
      radial-gradient(120% 100% at 50% 32%, #127048 0%, #0b5334 45%, #06371f 78%, #041f12 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4.5vh, 44px);
    user-select: none;
    -webkit-user-select: none;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(60% 42% at 50% 10%, rgba(255,255,255,.06), transparent 70%);
    pointer-events: none;
  }

  header { text-align: center; z-index: 2; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(26px, 7.6vw, 50px);
    letter-spacing: .06em;
    text-transform: uppercase;
    line-height: 1;
    background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 42%, var(--gold-lo) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.6));
    text-wrap: balance;
  }
  .subtitle {
    margin-top: .6em;
    font-size: clamp(10px, 2.7vw, 12px);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #a9c7b4;
    padding-left: .3em;
  }

  .stage {
    position: relative;
    width: min(86vw, 66vh, 440px);
    aspect-ratio: 1;
  }

  /* fixed ball marker at the top of the track */
  .marker {
    position: absolute;
    top: -1.5%; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
    pointer-events: none;
  }
  .marker .arrow {
    width: 0; height: 0;
    border-left: 3.4vmin solid transparent;
    border-right: 3.4vmin solid transparent;
    border-top: 4.4vmin solid var(--gold);
  }
  .marker .ball {
    width: 3.4vmin; height: 3.4vmin;
    margin-top: -.7vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffffff, #e6e6e6 45%, #a8a8a8 100%);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.35);
  }

  .wheel {
    position: absolute; inset: 0;
    border-radius: 50%;
    cursor: grab;
    touch-action: none;
    will-change: transform;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,.6), 0 6px 14px rgba(0,0,0,.4);
  }
  .wheel.grabbing { cursor: grabbing; }
  .wheel svg { display: block; width: 100%; height: 100%; }

  .emoji {
    position: absolute; top: 50%; left: 50%;
    font-size: 11.5vmin; line-height: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .emoji.gun { width: 17vmin; }
  .emoji.gun svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <header>
    <h1>Кризис-Рулетка</h1>
  </header>

  <div class="stage">
    <div class="marker"><div class="arrow"></div><div class="ball"></div></div>

    <div class="wheel" id="wheel">
      <svg viewBox="0 0 100 100" aria-label="колесо рулетки">
        <defs>
          <radialGradient id="wood" cx="45%" cy="38%" r="72%">
            <stop offset="0" stop-color="#834a26"/>
            <stop offset="1" stop-color="#3a1d0e"/>
          </radialGradient>
          <radialGradient id="brassRing" cx="50%" cy="35%" r="72%">
            <stop offset="0" stop-color="#f7e08a"/>
            <stop offset=".55" stop-color="#c79a2e"/>
            <stop offset="1" stop-color="#7d5713"/>
          </radialGradient>
          <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7e08a"/>
            <stop offset=".5" stop-color="#d5aa3c"/>
            <stop offset="1" stop-color="#8a6015"/>
          </linearGradient>
          <radialGradient id="chrome" cx="40%" cy="34%" r="70%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".5" stop-color="#cdd2d6"/>
            <stop offset="1" stop-color="#7f858b"/>
          </radialGradient>
          <radialGradient id="pRed" cx="50%" cy="40%" r="75%">
            <stop offset="0" stop-color="#b8281f"/><stop offset="1" stop-color="#7c1611"/>
          </radialGradient>
          <radialGradient id="pBlack" cx="50%" cy="40%" r="75%">
            <stop offset="0" stop-color="#23262c"/><stop offset="1" stop-color="#0d0f12"/>
          </radialGradient>
          <radialGradient id="pGreen" cx="50%" cy="40%" r="75%">
            <stop offset="0" stop-color="#0f7d47"/><stop offset="1" stop-color="#084d2b"/>
          </radialGradient>
        </defs>

        <!-- wooden wheel head -->
        <circle cx="50" cy="50" r="49" fill="url(#wood)"/>
        <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="0.6"/>
        <!-- studs around the wood ring -->
        <g fill="url(#brass)" id="studs"></g>
        <!-- brass outer ring -->
        <circle cx="50" cy="50" r="42" fill="url(#brassRing)"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="0.5"/>

        <!-- pockets: 3 sectors (black / green / red) -->
        <path d="M50,50 L50,10 A40,40 0 0,1 84.64,70 Z" fill="url(#pBlack)"/>
        <path d="M50,50 L84.64,70 A40,40 0 0,1 15.36,70 Z" fill="url(#pGreen)"/>
        <path d="M50,50 L15.36,70 A40,40 0 0,1 50,10 Z" fill="url(#pRed)"/>

        <!-- gold frets between pockets -->
        <g stroke="url(#brass)" stroke-width="1.4" stroke-linecap="round">
          <line x1="50" y1="13" x2="50" y2="49"/>
          <line x1="61.26" y1="56.5" x2="84.64" y2="70"/>
          <line x1="38.74" y1="56.5" x2="15.36" y2="70"/>
        </g>
        <!-- fret pins at the rim -->
        <g fill="url(#chrome)">
          <circle cx="50" cy="10" r="1.7"/>
          <circle cx="84.64" cy="70" r="1.7"/>
          <circle cx="15.36" cy="70" r="1.7"/>
        </g>

        <!-- inner brass ring -->
        <circle cx="50" cy="50" r="13" fill="url(#brassRing)"/>
        <circle cx="50" cy="50" r="13" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="0.5"/>

        <!-- central turret -->
        <g transform="rotate(45 50 50)">
          <rect x="48.4" y="39" width="3.2" height="22" rx="1.6" fill="url(#brass)"/>
          <rect x="39" y="48.4" width="22" height="3.2" rx="1.6" fill="url(#brass)"/>
          <g fill="url(#chrome)">
            <circle cx="50" cy="39" r="2.1"/>
            <circle cx="50" cy="61" r="2.1"/>
            <circle cx="39" cy="50" r="2.1"/>
            <circle cx="61" cy="50" r="2.1"/>
          </g>
        </g>
        <circle cx="50" cy="50" r="5.2" fill="url(#chrome)"/>
        <circle cx="50" cy="50" r="2.4" fill="url(#brass)"/>
      </svg>

      <!-- icons painted on the pockets -->
      <div class="emoji gun" data-a="0">
        <svg viewBox="0 0 140 104" aria-label="пистолет">
          <defs>
            <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#aab2bd"/><stop offset=".42" stop-color="#5a626c"/>
              <stop offset=".52" stop-color="#3b4149"/><stop offset="1" stop-color="#1c2026"/>
            </linearGradient>
            <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a515b"/><stop offset="1" stop-color="#14171c"/>
            </linearGradient>
          </defs>
          <path d="M78,50 L110,50 L118,99 L92,99 Z" fill="url(#steelDark)"/>
          <g stroke="rgba(0,0,0,.4)" stroke-width="2">
            <line x1="90" y1="60" x2="112" y2="60"/><line x1="91" y1="70" x2="114" y2="70"/>
            <line x1="92" y1="80" x2="116" y2="80"/><line x1="93" y1="90" x2="117" y2="90"/>
          </g>
          <path d="M60,52 q-13,10 -4,26 q6,10 20,8" fill="none" stroke="url(#steelDark)" stroke-width="7" stroke-linecap="round"/>
          <path d="M64,58 q-4,9 1,17" fill="none" stroke="#2a2f36" stroke-width="4" stroke-linecap="round"/>
          <rect x="40" y="46" width="72" height="12" rx="3" fill="url(#steel)"/>
          <rect x="6" y="26" width="108" height="22" rx="5" fill="url(#steel)"/>
          <rect x="10" y="28" width="100" height="3" rx="1.5" fill="rgba(255,255,255,.35)"/>
          <rect x="66" y="31" width="26" height="9" rx="2" fill="#1a1e23"/>
          <g stroke="#20252b" stroke-width="2.4">
            <line x1="98" y1="30" x2="98" y2="44"/><line x1="103" y1="30" x2="103" y2="44"/><line x1="108" y1="30" x2="108" y2="44"/>
          </g>
          <rect x="102" y="19" width="9" height="8" rx="1.5" fill="url(#steel)"/>
          <rect x="16" y="20" width="6" height="7" rx="1.5" fill="url(#steel)"/>
          <rect x="4" y="30" width="10" height="14" rx="2" fill="url(#steelDark)"/>
          <circle cx="9" cy="37" r="3.4" fill="#0c0e11"/>
        </svg>
      </div>
      <span class="emoji" data-a="120">🍺</span>
      <span class="emoji" data-a="240">🏍️</span>
    </div>
  </div>

<script>
(function () {
  const wheel = document.getElementById('wheel');

  // decorative studs on the wooden ring
  const studs = document.getElementById('studs');
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', (50 + 45.5 * Math.sin(a)).toFixed(2));
    c.setAttribute('cy', (50 - 45.5 * Math.cos(a)).toFixed(2));
    c.setAttribute('r', '1.1');
    studs.appendChild(c);
  }

  // place each icon at the centre of its 120° pocket
  const R = 26;
  document.querySelectorAll('.emoji').forEach(el => {
    const a = (parseFloat(el.dataset.a) + 60) * Math.PI / 180;
    el.style.left = (50 + R * Math.sin(a)) + '%';
    el.style.top  = (50 - R * Math.cos(a)) + '%';
    el.style.transform = 'translate(-50%, -50%)';
  });

  /* ---------- manual spin (flick) with inertia + haptics ---------- */
  let angle = -60;          // current rotation (deg)
  let vel = 0;              // deg per ms
  let dragging = false;
  let raf = null;
  let center = null, lastA = 0, lastT = 0, lastPeg = 0, lastTickPeg = 0;
  const PEG = 8;            // degrees between haptic ticks (smaller = more frequent)
  const TICK_PEG = 24;      // degrees between sound ticks (sparser than haptics)
  const FRICTION = 0.9988;  // per-ms velocity decay
  const STOP = 0.0016;      // stop threshold (deg/ms)
  const MAXV = 2.2;         // clamp flick speed

  /* ---------- sound (Web Audio API, no files) ---------- */
  let AC = null;
  function ctx() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tick() {
    const ac = ctx();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'square';
    o.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.06);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + 0.07);
  }
  function ding() {
    const ac = ctx();
    [880, 1320, 1760].forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      const t = ac.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(ac.destination);
      o.start(t);
      o.stop(t + 0.55);
    });
  }

  function render() { wheel.style.transform = 'rotate(' + angle + 'deg)'; }
  render();

  function buzz() {
    const peg = Math.round(angle / PEG);
    if (peg !== lastPeg) { lastPeg = peg; if (navigator.vibrate) navigator.vibrate(16); }
    const tp = Math.round(angle / TICK_PEG);
    if (tp !== lastTickPeg) { lastTickPeg = tp; tick(); }
  }
  function centreXY() {
    const r = wheel.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function ptAngle(e) {
    return Math.atan2(e.clientY - center.y, e.clientX - center.x) * 180 / Math.PI;
  }
  function norm(d) { while (d > 180) d -= 360; while (d < -180) d += 360; return d; }

  wheel.addEventListener('pointerdown', e => {
    e.preventDefault();
    ctx();                    // unlock audio on the user gesture
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    dragging = true; vel = 0;
    wheel.classList.add('grabbing');
    try { wheel.setPointerCapture(e.pointerId); } catch (_) {}
    center = centreXY();
    lastA = ptAngle(e); lastT = performance.now();
  });

  wheel.addEventListener('pointermove', e => {
    if (!dragging) return;
    e.preventDefault();
    const a = ptAngle(e);
    const d = norm(a - lastA);
    const now = performance.now();
    const dt = now - lastT;
    angle += d; render(); buzz();
    if (dt > 0) vel = d / dt;
    lastA = a; lastT = now;
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    wheel.classList.remove('grabbing');
    try { wheel.releasePointerCapture(e.pointerId); } catch (_) {}
    if (vel > MAXV) vel = MAXV; if (vel < -MAXV) vel = -MAXV;
    let last = performance.now();
    function inertia(now) {
      const dt = Math.min(now - last, 40); last = now;
      angle += vel * dt; render(); buzz();
      vel *= Math.pow(FRICTION, dt);
      if (Math.abs(vel) < STOP) { vel = 0; raf = null; finish(); return; }
      raf = requestAnimationFrame(inertia);
    }
    raf = requestAnimationFrame(inertia);
  }
  wheel.addEventListener('pointerup', release);
  wheel.addEventListener('pointercancel', release);

  function finish() {
    ding();
    if (navigator.vibrate) navigator.vibrate([45, 55, 75, 55, 90]);
  }
})();
</script>
</body>
</html>
