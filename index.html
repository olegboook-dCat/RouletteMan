<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0d0f">
<title>Бес в ребро</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold-hi: #f7e08a;
    --gold: #e8c14e;
    --gold-lo: #9c7016;
    --ink: #0a0d0f;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8e2d4;
    background:
      radial-gradient(120% 90% at 50% 18%, #1c2a2b 0%, #10171a 46%, #070a0b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 4vh, 40px);
    user-select: none;
    -webkit-user-select: none;
  }
  /* subtle spotlight */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(60% 40% at 50% 8%, rgba(247,224,138,.10), transparent 70%);
    pointer-events: none;
  }

  header { text-align: center; z-index: 2; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(28px, 8vw, 52px);
    letter-spacing: .08em;
    text-transform: uppercase;
    line-height: 1;
    background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 42%, var(--gold-lo) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.6));
    text-wrap: balance;
  }
  .subtitle {
    margin-top: .5em;
    font-size: clamp(10px, 2.8vw, 13px);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: #8b9a9c;
    padding-left: .34em;
  }

  /* 3D scene */
  .scene {
    perspective: 1300px;
    perspective-origin: 50% 35%;
  }
  .tilt {
    position: relative;
    width: min(84vw, 60vh, 460px);
    aspect-ratio: 1;
    transform: rotateX(18deg);
    transform-style: preserve-3d;
  }

  /* pointer */
  .pointer {
    position: absolute;
    top: -5%;
    left: 50%;
    width: 9%;
    height: 15%;
    transform: translateX(-50%) translateZ(46px);
    z-index: 10;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.6));
  }
  .pointer::before {
    content: "";
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  }
  .pointer::after {
    content: "";
    position: absolute;
    top: -14%;
    left: 50%;
    width: 42%;
    height: 42%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff5cf, var(--gold) 55%, var(--gold-lo));
    box-shadow: 0 1px 2px rgba(0,0,0,.5);
  }

  /* metallic rim */
  .wheel-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 4.5%;
    background: linear-gradient(145deg, #f7e08a, #c79a2e 35%, #7d5713 70%, #f2d876);
    box-shadow:
      0 0 0 1px #3a2a0c,
      inset 0 0 0 2px rgba(255,255,255,.25),
      0 26px 40px -8px rgba(0,0,0,.7),
      0 8px 14px rgba(0,0,0,.5);
  }

  .disc {
    position: absolute;
    inset: 4.5%;
    border-radius: 50%;
    transition: transform 5.6s cubic-bezier(.16,.62,.15,1);
    transform-style: preserve-3d;
  }
  .disc svg { display: block; width: 100%; height: 100%; border-radius: 50%; }

  .emoji {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: 13vmin;
    line-height: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.55));
  }
  .emoji.gun { width: 21vmin; }
  .emoji.gun svg { display: block; width: 100%; height: auto; }

  /* fixed gloss highlight — sells the 3D dome */
  .gloss {
    position: absolute;
    inset: 4.5%;
    border-radius: 50%;
    pointer-events: none;
    background:
      radial-gradient(70% 55% at 34% 26%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
      radial-gradient(120% 100% at 50% 120%, rgba(0,0,0,.45), rgba(0,0,0,0) 55%);
    mix-blend-mode: screen;
    z-index: 4;
  }

  /* center hub / spin knob */
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 24%;
    height: 24%;
    transform: translate(-50%, -50%) translateZ(40px);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fdfbf4 0%, #d8d2c4 38%, #8f897b 72%, #55504a 100%);
    box-shadow:
      0 0 0 3px #6a4c12,
      0 0 0 5px rgba(255,255,255,.18),
      0 10px 18px rgba(0,0,0,.6),
      inset 0 -4px 8px rgba(0,0,0,.35),
      inset 0 3px 6px rgba(255,255,255,.7);
    z-index: 8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease;
  }
  .hub::after {
    content: "";
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--gold-hi), var(--gold) 50%, var(--gold-lo));
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.4), 0 1px 2px rgba(255,255,255,.4);
  }
  .hub:active { transform: translate(-50%, -50%) translateZ(40px) scale(.9); }
  .hub.spinning { cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .disc { transition-duration: 2.4s; }
  }
</style>
</head>
<body>
  <header>
    <h1>Бес&nbsp;в&nbsp;ребро</h1>
    <div class="subtitle">крути — судьба решит</div>
  </header>

  <div class="scene">
    <div class="tilt">
      <div class="pointer"></div>

      <div class="wheel-wrap">
        <div class="disc" id="disc">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="sRed" cx="50%" cy="34%" r="70%">
                <stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#6e1b13"/>
              </radialGradient>
              <radialGradient id="sBlue" cx="50%" cy="34%" r="70%">
                <stop offset="0" stop-color="#2c6d82"/><stop offset="1" stop-color="#123945"/>
              </radialGradient>
              <radialGradient id="sGold" cx="50%" cy="34%" r="70%">
                <stop offset="0" stop-color="#c8912f"/><stop offset="1" stop-color="#6d4a12"/>
              </radialGradient>
            </defs>
            <!-- 3 sectors, 120° each -->
            <path d="M50,50 L50,2 A48,48 0 0,1 91.57,74 Z" fill="url(#sRed)"/>
            <path d="M50,50 L91.57,74 A48,48 0 0,1 8.43,74 Z" fill="url(#sBlue)"/>
            <path d="M50,50 L8.43,74 A48,48 0 0,1 50,2 Z" fill="url(#sGold)"/>
            <!-- divider lines -->
            <g stroke="rgba(0,0,0,.35)" stroke-width="0.6">
              <line x1="50" y1="50" x2="50" y2="2"/>
              <line x1="50" y1="50" x2="91.57" y2="74"/>
              <line x1="50" y1="50" x2="8.43" y2="74"/>
            </g>
          </svg>

          <div class="emoji gun" data-a="0">
            <svg viewBox="0 0 140 104" aria-label="пистолет">
              <defs>
                <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#aab2bd"/>
                  <stop offset=".42" stop-color="#5a626c"/>
                  <stop offset=".52" stop-color="#3b4149"/>
                  <stop offset="1" stop-color="#1c2026"/>
                </linearGradient>
                <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#4a515b"/>
                  <stop offset="1" stop-color="#14171c"/>
                </linearGradient>
              </defs>
              <!-- grip -->
              <path d="M78,50 L110,50 L118,99 L92,99 Z" fill="url(#steelDark)"/>
              <!-- grip checkering -->
              <g stroke="rgba(0,0,0,.4)" stroke-width="2">
                <line x1="90" y1="60" x2="112" y2="60"/>
                <line x1="91" y1="70" x2="114" y2="70"/>
                <line x1="92" y1="80" x2="116" y2="80"/>
                <line x1="93" y1="90" x2="117" y2="90"/>
              </g>
              <!-- trigger guard -->
              <path d="M60,52 q-13,10 -4,26 q6,10 20,8" fill="none"
                    stroke="url(#steelDark)" stroke-width="7" stroke-linecap="round"/>
              <!-- trigger -->
              <path d="M64,58 q-4,9 1,17" fill="none" stroke="#2a2f36" stroke-width="4" stroke-linecap="round"/>
              <!-- frame under slide -->
              <rect x="40" y="46" width="72" height="12" rx="3" fill="url(#steel)"/>
              <!-- slide -->
              <rect x="6" y="26" width="108" height="22" rx="5" fill="url(#steel)"/>
              <!-- slide top highlight -->
              <rect x="10" y="28" width="100" height="3" rx="1.5" fill="rgba(255,255,255,.35)"/>
              <!-- ejection port -->
              <rect x="66" y="31" width="26" height="9" rx="2" fill="#1a1e23"/>
              <!-- rear serrations -->
              <g stroke="#20252b" stroke-width="2.4">
                <line x1="98" y1="30" x2="98" y2="44"/>
                <line x1="103" y1="30" x2="103" y2="44"/>
                <line x1="108" y1="30" x2="108" y2="44"/>
              </g>
              <!-- sights -->
              <rect x="102" y="19" width="9" height="8" rx="1.5" fill="url(#steel)"/>
              <rect x="16" y="20" width="6" height="7" rx="1.5" fill="url(#steel)"/>
              <!-- muzzle -->
              <rect x="4" y="30" width="10" height="14" rx="2" fill="url(#steelDark)"/>
              <circle cx="9" cy="37" r="3.4" fill="#0c0e11"/>
            </svg>
          </div>

          <span class="emoji" data-a="120">🍺</span>
          <span class="emoji" data-a="240">🏍️</span>
        </div>

        <div class="gloss"></div>
      </div>

      <div class="hub" id="hub"></div>
    </div>
  </div>

<script>
(function () {
  const disc = document.getElementById('disc');
  const hub  = document.getElementById('hub');

  // Place each icon at the centre of its 120° sector.
  const R = 30; // ring radius in % of the disc
  document.querySelectorAll('.emoji').forEach(el => {
    const a = (parseFloat(el.dataset.a) + 60) * Math.PI / 180;
    el.style.left = (50 + R * Math.sin(a)) + '%';
    el.style.top  = (50 - R * Math.cos(a)) + '%';
    // keep the translate that centres the element
    el.style.transform = 'translate(-50%, -50%)';
  });

  /* ---------- Audio: ratchet wheel (Web Audio API, no files) ---------- */
  let AC = null;
  function ctx() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  // Short noise buffer reused for every click (the flapper hitting a peg).
  let NOISE = null;
  function noiseBuffer(ac) {
    if (NOISE) return NOISE;
    const len = Math.floor(ac.sampleRate * 0.05);
    NOISE = ac.createBuffer(1, len, ac.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    return NOISE;
  }
  function clack(vol) {
    const ac = ctx();
    const t = ac.currentTime;
    // bright transient — the flapper snap
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2700; bp.Q.value = 1.1;
    const gn = ac.createGain();
    gn.gain.value = 0.5 * vol;
    src.connect(bp).connect(gn).connect(ac.destination);
    src.start(t);
    // woody body — the peg
    const o = ac.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(340, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.035);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.45 * vol, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g2).connect(ac.destination);
    o.start(t); o.stop(t + 0.06);
  }
  function fanfare() {
    const ac = ctx();
    [660, 990, 1320].forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      const t = ac.currentTime + i * 0.10;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + 0.6);
    });
  }

  /* ---------- Spin ---------- */
  const DURATION = 5600;   // matches the CSS transition
  const PEGS = 16;         // clicks per full revolution
  let rot = 0, spinning = false;

  function scheduleClicks(totalDeg) {
    const start = performance.now();
    const total = Math.floor(totalDeg / (360 / PEGS));
    let done = 0;
    function step(now) {
      const p = Math.min((now - start) / DURATION, 1);
      const eased = 1 - Math.pow(1 - p, 3);   // decelerating, like the wheel
      const target = Math.floor(eased * total);
      while (done < target) { clack(0.4 + 0.6 * (1 - p)); done++; }
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    ctx();
    hub.classList.add('spinning');

    const turns = 5 + Math.floor(Math.random() * 3);
    const extra = Math.floor(Math.random() * 360);
    const delta = turns * 360 + extra;
    rot += delta;
    disc.style.transform = 'rotate(' + rot + 'deg)';

    scheduleClicks(delta);
    setTimeout(() => {
      spinning = false;
      hub.classList.remove('spinning');
      fanfare();
    }, DURATION);
  }

  hub.addEventListener('click', spin);
})();
</script>
</body>
</html>
